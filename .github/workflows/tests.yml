#
# Correctness gate for the recycler (docs/PRODUCTION_PLAN.md section 9.4, docs/CI.md).
#
# MainDistributionPipeline.yml stays the only producer of graded binaries; nothing here is
# published. Every build job compiles the pinned duckdb submodule with the extension-ci-tools
# makefile, exactly like a developer's "make release", and runs the recycler sqllogictests
# against the resulting unittest binary. The slow jobs (debug, asan-ubsan, tsan) run for every
# pull request and, by hand, only when the "full" input is set.
#
name: Tests

on:
  workflow_dispatch:
    inputs:
      full:
        description: Also run debug, asan-ubsan and tsan (pull requests always do)
        type: boolean
        default: false
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  GEN: ninja
  # The tag MainDistributionPipeline.yml pins. The shallow submodule checkout carries no tags, so
  # every build job fetches this one: duckdb's CMake derives the version from `git describe`, and
  # stock DuckDB refuses to load an extension stamped with another version.
  DUCKDB_TAG: v1.5.5
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 1G

jobs:
  build-test:
    name: Release build and recycler suites
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check the duckdb submodule is at the pinned tag
        run: |
          git -C duckdb fetch --quiet --depth=1 origin tag "$DUCKDB_TAG"
          test "$(git -C duckdb rev-parse "$DUCKDB_TAG^{commit}")" = "$(git -C duckdb rev-parse HEAD)"

      - name: Install build tools
        run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ninja-build ccache

      - name: Submodule commit for the cache key
        id: pin
        run: echo "duckdb=$(git rev-parse HEAD:duckdb)" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ github.job }}-${{ steps.pin.outputs.duckdb }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ github.job }}-${{ steps.pin.outputs.duckdb }}-
            ccache-${{ github.job }}-

      - name: Build
        run: make release && ccache --show-stats

      # Saved before the tests so that a red test run still warms the next build.
      - name: Save ccache
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ github.job }}-${{ steps.pin.outputs.duckdb }}-${{ github.run_id }}

      - name: Recycler suites
        run: |
          ./build/release/test/unittest "test/sql/recycler/*"
          ./build/release/test/unittest "test/sql/waddle.test"

      - name: Upload the loadable extension for the stock-duckdb job
        uses: actions/upload-artifact@v4
        with:
          name: waddle-linux_amd64
          path: build/release/extension/waddle/waddle.duckdb_extension
          retention-days: 7

  debug:
    name: Debug build (D_ASSERT) and recycler suites
    if: github.event_name == 'pull_request' || inputs.full == true
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # Sanitizers are the asan-ubsan job's business; without them the -O0 binary runs the
      # suites several times faster and a failure here is an assertion or a logic error.
      DISABLE_SANITIZER: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check the duckdb submodule is at the pinned tag
        run: |
          git -C duckdb fetch --quiet --depth=1 origin tag "$DUCKDB_TAG"
          test "$(git -C duckdb rev-parse "$DUCKDB_TAG^{commit}")" = "$(git -C duckdb rev-parse HEAD)"

      - name: Install build tools
        run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ninja-build ccache

      - name: Submodule commit for the cache key
        id: pin
        run: echo "duckdb=$(git rev-parse HEAD:duckdb)" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ github.job }}-${{ steps.pin.outputs.duckdb }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ github.job }}-${{ steps.pin.outputs.duckdb }}-
            ccache-${{ github.job }}-

      - name: Build
        run: make debug && ccache --show-stats

      - name: Save ccache
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ github.job }}-${{ steps.pin.outputs.duckdb }}-${{ github.run_id }}

      - name: Recycler suites
        run: |
          ./build/debug/test/unittest "test/sql/recycler/*"
          ./build/debug/test/unittest "test/sql/waddle.test"

  asan-ubsan:
    name: Address and undefined-behaviour sanitizers
    if: github.event_name == 'pull_request' || inputs.full == true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check the duckdb submodule is at the pinned tag
        run: |
          git -C duckdb fetch --quiet --depth=1 origin tag "$DUCKDB_TAG"
          test "$(git -C duckdb rev-parse "$DUCKDB_TAG^{commit}")" = "$(git -C duckdb rev-parse HEAD)"

      - name: Install build tools
        run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ninja-build ccache

      - name: Submodule commit for the cache key
        id: pin
        run: echo "duckdb=$(git rev-parse HEAD:duckdb)" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ github.job }}-${{ steps.pin.outputs.duckdb }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ github.job }}-${{ steps.pin.outputs.duckdb }}-
            ccache-${{ github.job }}-

      # The makefile has no variable that adds sanitizers to a Release build (DISABLE_SANITIZER
      # and DISABLE_UBSAN only remove them). Its relassert target is RelWithDebInfo with
      # FORCE_ASSERT=1, under which duckdb/CMakeLists.txt compiles with -fsanitize=address and
      # -fsanitize=undefined -fno-sanitize-recover=all; DuckDB's own Main.yml uses the same target.
      - name: Build
        run: make relassert && ccache --show-stats

      - name: Save ccache
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ github.job }}-${{ steps.pin.outputs.duckdb }}-${{ github.run_id }}

      - name: Recycler suites
        run: |
          ./build/relassert/test/unittest "test/sql/recycler/*"
          ./build/relassert/test/unittest "test/sql/waddle.test"

  tsan:
    name: Thread sanitizer on the stress test
    if: github.event_name == 'pull_request' || inputs.full == true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # THREADSAN=1 is the makefile's switch for -DENABLE_THREAD_SANITIZER=1; clang and the
      # suppression list are what DuckDB's own thread-sanitizer job uses.
      THREADSAN: 1
      CC: clang
      CXX: clang++
      TSAN_OPTIONS: suppressions=${{ github.workspace }}/duckdb/.sanitizer-thread-suppressions.txt
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check the duckdb submodule is at the pinned tag
        run: |
          git -C duckdb fetch --quiet --depth=1 origin tag "$DUCKDB_TAG"
          test "$(git -C duckdb rev-parse "$DUCKDB_TAG^{commit}")" = "$(git -C duckdb rev-parse HEAD)"

      - name: Install build tools
        run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ninja-build ccache clang

      - name: Submodule commit for the cache key
        id: pin
        run: echo "duckdb=$(git rev-parse HEAD:duckdb)" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ github.job }}-${{ steps.pin.outputs.duckdb }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ github.job }}-${{ steps.pin.outputs.duckdb }}-
            ccache-${{ github.job }}-

      - name: Build
        run: make reldebug && ccache --show-stats

      - name: Save ccache
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ github.job }}-${{ steps.pin.outputs.duckdb }}-${{ github.run_id }}

      # The unittest runner exits 0 when a pattern matches no test, so the file is checked first.
      - name: Stress test
        run: |
          test -f test/sql/recycler/recycler_stress.test
          ./build/reldebug/test/unittest "test/sql/recycler/recycler_stress.test"

  stock-duckdb:
    name: Loadable extension in the PyPI duckdb wheel
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: waddle-linux_amd64
          path: build/release/extension/waddle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1.5.5 is on PyPI (checked with `pip index versions duckdb` on 2026-10-01).
      - name: Install stock DuckDB
        run: pip install duckdb==1.5.5

      - name: Differential check
        run: python3 scripts/ci_stock_duckdb.py build/release/extension/waddle/waddle.duckdb_extension

  format:
    name: clang-format (DuckDB style)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Non-blocking until src/ has been through `make format`: 32 violations on 2026-10-01.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The version duckdb/scripts/format.py insists on; newer releases format differently.
      - name: Install clang-format
        run: pip install clang-format==11.0.1

      # clang-format 11 reads the nearest .clang-format above each file, so the root copy must be
      # DuckDB's; the comparison fails the job the day the submodule bump changes the style.
      - name: Check
        run: |
          cmp .clang-format duckdb/.clang-format
          clang-format --dry-run -Werror --sort-includes=0 -style=file src/*.cpp src/include/*.hpp

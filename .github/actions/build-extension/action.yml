#
# The build that every build job of tests.yml shares: the pinned duckdb submodule compiled with
# the extension-ci-tools makefile under ccache, exactly like a developer's "make <target>".
#
# The caller checks the repository out with its submodules first (a local action only exists
# after the checkout) and puts any makefile switch the target needs (THREADSAN, DISABLE_SANITIZER,
# CC/CXX) in its job env, which these steps inherit.
#
name: Build the extension
description: Verify the duckdb submodule pin, restore ccache, run one make target, save ccache

inputs:
  target:
    description: The makefile target to build (release, debug, relassert, reldebug)
    required: true
  duckdb-tag:
    description: The duckdb tag the submodule must be checked out at
    required: true
  extra-packages:
    description: apt packages the target needs beyond ninja-build and ccache
    default: ''

runs:
  using: composite
  steps:
    # A hosted runner starts with about 14 GB free. A debug or sanitizer build of DuckDB with debug
    # information, plus its 2 GB ccache, does not fit: the first pull request run died in the final
    # links with "No space left on device". The preinstalled .NET, Android, Haskell, Boost, CodeQL, Java,
    # Swift, Node, PowerShell and browser toolchains are not used by any job that builds; the first five
    # alone free about 25 GB.
    - name: Free disk space
      shell: bash
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/lib/jvm /usr/share/swift /usr/local/.ghcup /usr/local/lib/node_modules \
          /usr/local/share/powershell /usr/local/share/chromium /opt/google /opt/microsoft
        sudo docker image prune --all --force > /dev/null
        df -h /

    # The runner has 7.8 GB of memory and the sanitizer build's last links are large. Swap is added only
    # when /mnt is a disk of its own: on 2026-10-06 a 16 GB swap file on /mnt left the sanitizer build
    # without space on / ("No space left on device"), so /mnt evidently shared the root disk there.
    - name: Add swap
      shell: bash
      run: |
        df -h / /mnt || df -h /
        if [ -d /mnt ] && [ "$(df --output=source / | tail -1)" != "$(df --output=source /mnt | tail -1)" ]; then
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile > /dev/null
          sudo swapon /mnt/swapfile
        else
          echo "/mnt is on the root disk: no swap added, the build needs that space"
        fi
        free -h

    # The shallow submodule checkout carries no tags, so this fetches the one tag: duckdb's CMake
    # derives the version from `git describe`, and stock DuckDB refuses to load an extension
    # stamped with another version.
    - name: Check the duckdb submodule is at the pinned tag
      shell: bash
      env:
        TAG: ${{ inputs.duckdb-tag }}
      run: |
        git -C duckdb fetch --quiet --depth=1 origin tag "$TAG"
        test "$(git -C duckdb rev-parse "$TAG^{commit}")" = "$(git -C duckdb rev-parse HEAD)"

    - name: Install build tools
      shell: bash
      env:
        EXTRA: ${{ inputs.extra-packages }}
      run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ninja-build ccache $EXTRA

    - name: Submodule commit for the cache key
      id: pin
      shell: bash
      run: echo "duckdb=$(git rev-parse HEAD:duckdb)" >> "$GITHUB_OUTPUT"

    - name: Restore ccache
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/.ccache
        key: ccache-${{ github.job }}-${{ steps.pin.outputs.duckdb }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ github.job }}-${{ steps.pin.outputs.duckdb }}-
          ccache-${{ github.job }}-

    # duckdb's CMakeLists.txt picks ccache up as the compiler launcher whenever it is on PATH.
    - name: Build
      shell: bash
      env:
        GEN: ninja
        CCACHE_DIR: ${{ github.workspace }}/.ccache
        CCACHE_MAXSIZE: 2G
        TARGET: ${{ inputs.target }}
      run: make "$TARGET" && ccache --show-stats

    # A runner that runs out of disk can die without saying so (exit 143), so the space left is logged
    # whatever the build did.
    - name: Disk space after the build
      if: ${{ always() }}
      shell: bash
      run: df -h / /mnt && du -sh build "$GITHUB_WORKSPACE/.ccache" 2>/dev/null || true

    # Saved before the caller's tests so that a red test run still warms the next build, and after a
    # failed or cancelled build too: the objects it did compile are valid, and a cold sanitizer build is
    # over an hour. A runner shut down in the build reports the run as cancelled, so !cancelled() skipped
    # this step and every sanitizer run started cold.
    - name: Save ccache
      if: ${{ always() }}
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/.ccache
        key: ccache-${{ github.job }}-${{ steps.pin.outputs.duckdb }}-${{ github.run_id }}
